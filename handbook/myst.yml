# See docs at: https://mystmd.org/guide/frontmatter
version: 1

extends:
  - ./_site/site.yml

project:
  id: ca4d97b9-09e7-4ed5-9230-9dee58e5201c
  title: "POF Jupyter Book"
  # authors: ['Christopher Barnard', 'Joe McNorton', 'Francesca Di Giuseppe']
  github: https://github.com/ecmwf/AI-Probability-of-Fire

  toc:
    - file: index.md

    - title: PoF-Analysis
      children:
        - file: retrieving_data.md          # "Data Generator"
          children:
            - file: POF_Data_Generator.ipynb
        - file: POF_Trainer.ipynb           # "How we train an XGBoost Model for PoF"
        - file: forecasting.md              # "Forecasting"
          children:
            - file: POF_Forecast.ipynb
        - file: plotting.md                 # "Plotting"
          children:
            - file: POF_plotter.ipynb

    - title: PoF-Forecast
      children:
        - file: retrieving_opendata.md
          children:
            - file: POF_OpenData_Generator.ipynb
        - file: training_opendata.md
          children:
            - file: POF_OpenData_Trainer.ipynb
        - file: forecasting_opendata.md
          children:
            - file: POF_OpenData_Forecast.ipynb
        - file: plotting_opendata.md
          children:
            - file: POF_OpenData_plotter.ipynb

    - file: end.md                          # "Conclusion"
      title: Conclusion

site:
  template: book-theme
  options:
    favicon: images/favicon.ico
    logo: images/PoF-light.png
    logo_dark: images/PoF-dark.png
